<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
<title>is</title>
<!-- The mark is Ishita's stamp, lifted off its green ground as an alpha
     mask so the tab shows only the ring and the "is". The fill follows the
     browser's theme, because a single flat colour disappears on one of the
     two tab bars. -->
<defs>
<mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="160">
<image width="160" height="160" href="data:image/png;base64,"/>
</mask>
</defs>
<style>
  .mark{ fill:#17150f; }
  @media (prefers-color-scheme: dark){ .mark{ fill:#faf6ec; } }
</style>
<rect class="mark" width="160" height="160" mask="url(#m)"/>
</svg>
