<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
<title>is</title>
<!-- Ishita's stamp, lifted off its green ground as an alpha mask.
     Two optical corrections for tab size: as drawn, the mark is 44%
     letters, 12% ring and 41% empty moat between them, with a 0.52px
     stroke at 16px — thinner than a pixel, so the letters vanished. The
     letters are scaled up to close the moat and the strokes are thickened.
     The fill follows the browser theme, because one flat colour disappears
     on one of the two tab bars. -->
<defs>
<mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="160">
<image width="160" height="160" href="data:image/png;base64,"/>
</mask>
</defs>
<style>
  .mark{ fill:#17150f; }
  @media (prefers-color-scheme: dark){ .mark{ fill:#faf6ec; } }
</style>
<rect class="mark" width="160" height="160" mask="url(#m)"/>
</svg>
